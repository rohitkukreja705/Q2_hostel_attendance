<!DOCTYPE html>
<html>
<head>
  <title>Q2 Girls Hostel Attendance Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="js/face-api.min.js"></script>
  <script defer src="js/attendance.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>  
<body>

<header class="main-header">
  <h1>Q2 Girls Hostel Attendance Management System</h1>
  <div class="top-info">
    <div id="liveDate"></div>
    <div id="liveTime"></div>
    <div id="liveGPS"></div>
  </div>
</header>

<div class="container">
  <div class="camera-section">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div class="control-section">
    <p id="status">Tap to mark attendance</p>
    <button class="primary" onclick="startAttendance()">Mark Attendance</button>
    <button class="leave-btn" onclick="submitLeave()">Leave Request</button>
    <button class="complaint-btn" onclick="submitComplaint()">Complaint</button>
    <a href="enroll.html"><button class="secondary">Enroll Student</button></a>
  </div>
</div>

<!-- Progress Overlay -->
<div id="loader" class="loader hidden">
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="steps">
    <div id="step-ip">Checking IP</div>
    <div id="step-location">Checking Location</div>
    <div id="step-face">Loading Face Recognition</div>
    <div id="step-submit">Submitting</div>
  </div>
</div>
<div id="captureOverlay" class="capture-overlay hidden">
  <div class="capture-box">
    <h2 id="captureText">Look straight at camera</h2>
    <div id="countdown">5</div>
  </div>
</div>
</body>
</html>
